  <!-- Bottom Proof Bar -->
  <rect x="70" y="388" width="1060" height="36" rx="6" fill="#141A28" stroke="#2A3652" stroke-width="1"/>
  <text x="50%" y="411" text-anchor="middle" fill="#94A3B8" font-size="11.5" font-weight="600" letter-spacing="0.4">
    <tspan fill="#10B981">●</tspan> AIR-GAPPED MCP BARRIER   |   
    <tspan fill="#06B6D4">●</tspan> ZERO PROMPT INJECTION RISK   |   
    <tspan fill="#3B82F6">●</tspan> 100% PLAIN MARKDOWN   |   
    <tspan fill="#F59E0B">●</tspan> NO PROPRIETARY DATABASE LOCK-IN
