      <text x="10" y="16" fill="#FBBF24">📁</text>
      <text x="32" y="16" font-family="monospace" font-weight="bold">0_Inbox/</text>
      <text x="110" y="16" fill="#94A3B8" font-size="10.5">Unvetted external notes</text>

