<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%" style="background:#0B0E16; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E16"/>
      <stop offset="50%" stop-color="#101524"/>
      <stop offset="100%" stop-color="#0B0E16"/>
    </linearGradient>
    <linearGradient id="ambientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E2E"/>
      <stop offset="100%" stop-color="#11111B"/>
    </linearGradient>
    <linearGradient id="vaultGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
    <linearGradient id="codingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Ambient Keyframe Animations -->
    <style>
      @keyframes pulseBorder {
        0%, 100% { stroke: #2A3652; }
        50% { stroke: #10B981; }
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -40; }
      }
      @keyframes shieldPulse {
        0%, 100% { filter: drop-shadow(0 0 4px #10B981); opacity: 0.9; }
        50% { filter: drop-shadow(0 0 12px #34D399); opacity: 1; }
      }
      .window-border { animation: pulseBorder 6s ease-in-out infinite; }
      .flow-line { stroke-dasharray: 8 6; animation: flowDash 2s linear infinite; }
      .shield-glow { animation: shieldPulse 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Window Container -->
  <rect x="2" y="2" width="1196" height="456" rx="12" fill="url(#bgGrad)" stroke="#2A3652" stroke-width="2" class="window-border"/>

  <!-- Terminal Window Chrome -->
  <path d="M 2 14 Q 2 2 14 2 L 1186 2 Q 1198 2 1198 14 L 1198 42 L 2 42 Z" fill="#141A28"/>
  <line x1="2" y1="42" x2="1198" y2="42" stroke="#2A3652" stroke-width="1.5"/>

  <!-- Window Control Buttons -->
  <circle cx="24" cy="22" r="6" fill="#EF4444"/>
  <circle cx="44" cy="22" r="6" fill="#F59E0B"/>
  <circle cx="64" cy="22" r="6" fill="#10B981"/>

  <!-- Window Title -->
  <text x="50%" y="26" text-anchor="middle" fill="#94A3B8" font-size="13" font-weight="600" letter-spacing="0.5">second-brain-kit : air-gapped-multi-agent-vault.md</text>

  <!-- Live Status Badge (Top Right) -->
  <g class="shield-glow" transform="translate(1010, 13)">
    <rect width="164" height="20" rx="10" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <circle cx="12" cy="10" r="4" fill="#10B981"/>
    <text x="24" y="14" fill="#A7F3D0" font-size="10.5" font-weight="700" letter-spacing="0.5">AIR-GAP MCP ACTIVE</text>
  </g>

  <!-- ==================== FLOW CONNECTOR LINES ==================== -->
  <!-- Ambient Assistant to Shield Barrier -->
  <path d="M 360 220 L 450 220" stroke="#06B6D4" stroke-width="2.5" class="flow-line"/>
  <polygon points="452,220 442,215 442,225" fill="#06B6D4"/>
  <rect x="365" y="194" width="80" height="18" rx="4" fill="#0B0E16" stroke="#083344" stroke-width="1"/>
  <text x="405" y="206" text-anchor="middle" fill="#67E8F9" font-size="9" font-weight="600">INBOX ONLY</text>

  <!-- Coding Agents to Vault (Read & Update) -->
  <path d="M 840 220 L 750 220" stroke="#3B82F6" stroke-width="2.5" class="flow-line"/>
  <polygon points="748,220 758,215 758,225" fill="#3B82F6"/>
  <rect x="755" y="194" width="80" height="18" rx="4" fill="#0B0E16" stroke="#1E293B" stroke-width="1"/>
  <text x="795" y="206" text-anchor="middle" fill="#93C5FD" font-size="9" font-weight="600">READ PROJECTS</text>

  <!-- ==================== NODE 1: AMBIENT ASSISTANT ==================== -->
  <g transform="translate(70, 80)">
