  <g transform="translate(840, 80)">
    <rect width="290" height="290" rx="10" fill="url(#codingGrad)" stroke="#3B82F6" stroke-width="1.8"/>
    <!-- Header -->
    <rect width="290" height="42" rx="10" fill="#1E3A8A" opacity="0.4"/>
    <text x="18" y="26" fill="#60A5FA" font-size="11" font-weight="800" letter-spacing="1">EGRESS • CODING AGENTS</text>
    <rect x="200" y="12" width="75" height="18" rx="9" fill="#1E293B" stroke="#3B82F6" stroke-width="1"/>
    <text x="237" y="24" text-anchor="middle" fill="#93C5FD" font-size="9" font-weight="600">ENGINEERING</text>

    <!-- Main Title -->
    <text x="18" y="72" fill="#F8FAFC" font-size="20" font-weight="700">Autonomous Builders</text>
    <text x="18" y="94" fill="#93C5FD" font-size="12">Claude Code / Antigravity / Cursor</text>

    <!-- Separation Line -->
    <line x1="18" y1="110" x2="272" y2="110" stroke="#334155" stroke-width="1"/>

    <!-- Checklist -->
    <g transform="translate(18, 130)" font-size="12" fill="#CBD5E1">
      <text y="0" font-weight="600" fill="#60A5FA">●</text>
      <text x="16" y="0">Shared memory eliminates amnesia</text>
      
      <text y="28" font-weight="600" fill="#60A5FA">●</text>
      <text x="16" y="28">Reads conventions in 00-Conventions</text>
      
      <text y="56" font-weight="600" fill="#60A5FA">●</text>
      <text x="16" y="56">Executes engineering sprints</text>
      
      <text y="84" font-weight="600" fill="#10B981">✓</text>
      <text x="16" y="84" fill="#6EE7B7">Auto-generates daily dashboard</text>
      
      <text y="112" font-weight="600" fill="#10B981">✓</text>
      <text x="16" y="112" fill="#6EE7B7">Synchronizes multi-agent standup</text>
