    <text x="18" y="94" fill="#94A3B8" font-size="12">Telegram / Matrix / Mobile Voice</text>

    <!-- Separation Line -->
    <line x1="18" y1="110" x2="272" y2="110" stroke="#334155" stroke-width="1"/>

    <!-- Checklist -->
    <g transform="translate(18, 130)" font-size="12" fill="#CBD5E1">
      <text y="0" font-weight="600" fill="#22D3EE">●</text>
      <text x="16" y="0">Always-on remote communication</text>
      
      <text y="28" font-weight="600" fill="#22D3EE">●</text>
      <text x="16" y="28">Captures raw ideas &amp; voice memos</text>
      
      <text y="56" font-weight="600" fill="#EF4444">✗</text>
