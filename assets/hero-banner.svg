      <text x="10" y="72" fill="#A78BFA">📁</text>
      <text x="32" y="72" font-family="monospace" font-weight="bold">2_Areas/</text>
      <text x="110" y="72" fill="#94A3B8" font-size="10.5">Homelab runbooks &amp; infra</text>

      <rect x="0" y="84" width="260" height="24" rx="4" fill="#064E3B" stroke="#047857" stroke-width="1"/>
      <text x="10" y="100" fill="#34D399">📁</text>
      <text x="32" y="100" font-family="monospace" font-weight="bold">3_Resources/</text>
      <text x="110" y="100" fill="#94A3B8" font-size="10.5">Reference cheat sheets</text>

      <rect x="0" y="112" width="260" height="24" rx="4" fill="#064E3B" stroke="#047857" stroke-width="1"/>
      <text x="10" y="128" fill="#94A3B8">📁</text>
      <text x="32" y="128" font-family="monospace" font-weight="bold">4_Archives/</text>
      <text x="110" y="128" fill="#94A3B8" font-size="10.5">Cold completed projects</text>
